name = "littleroots-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# The Admin page (/admin) is served from ./public
[assets]
directory = "./public"
binding = "ASSETS"

# Database (created in the Cloudflare dashboard)
[[d1_databases]]
binding = "DB"
database_name = "littleroots"
database_id = "800809da-e79c-43c4-af28-71846f1e18b6"
migrations_dir = "migrations"

# Video + thumbnail storage (free tier: 10 GB). Create with `wrangler r2 bucket create littleroots-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "littleroots-media"

[vars]
# Public web address of this backend. Empty = the address it is reached at (e.g. https://littleroots-api.<you>.workers.dev)
PUBLIC_URL = ""
# Public address of the R2 bucket (custom domain or r2.dev), where streaming files are read from
MEDIA_PUBLIC_URL = "https://media.littlerootsstudios.com"
# Only these emails can create an Admin account (comma-separated)
ADMIN_EMAILS = "olusholaoluyomi@gmail.com,littlerootsstudios@gmail.com,ogunrooriyomi@gmail.com"
# Cloudflare account id (for direct uploads to R2)
R2_ACCOUNT_ID = "0e6af6e384c3d1a18b5ce0cfa04b3735"
R2_BUCKET = "littleroots-media"
# GitHub repository that runs the free video converter (GitHub Actions)
CONVERTER_REPO = "littlerootsstudios-ops/Littleroot-tv-app"
# "1" = simulate R2 uploads and the converter (local testing; set in .dev.vars). "0" = real.
MOCK_EXTERNAL = "0"

# Secrets (never written in this file). The deploy workflow sets them from the GitHub repository secrets:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  - R2 API token (Object Read & Write) for direct uploads
#   GITHUB_TOKEN                            - fine-grained token with "Actions: write" on CONVERTER_REPO
#   CONVERTER_SECRET                        - any long random text; also saved as a GitHub Actions secret
