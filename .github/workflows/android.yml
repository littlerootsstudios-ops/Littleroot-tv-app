# Builds the LittleRoots Android app (phones, tablets, Android TV / Google TV).
# The APK is attached to the run ("Artifacts") and also saved on the "apk" branch as LittleRoots.apk.
name: Build Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build the APK
        run: |
          gradle -p android assembleRelease --no-daemon > build.log 2>&1 || {
            cat build.log
            msg=$(grep -E "error:|FAILURE|What went wrong" -A3 build.log | head -n 12 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Android build failed::$msg"; exit 1; }
          tail -n 5 build.log
          ver=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk "out/LittleRoots.apk"
          echo "::notice title=APK ready::LittleRoots $ver ($(du -k out/LittleRoots.apk | cut -f1) KB)"
      - uses: actions/upload-artifact@v4
        with: { name: LittleRoots-android, path: out/LittleRoots.apk }
      - name: Save the APK on the apk branch
        run: |
          cd out
          git init -q -b apk
          git config user.name "LittleRoots builder"; git config user.email "actions@github.com"
          git add LittleRoots.apk
          git commit -qm "LittleRoots Android app from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
