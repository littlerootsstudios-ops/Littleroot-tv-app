# Publishes the LittleRoots backend, the TV app (/) and the Admin page (/admin) to Cloudflare.
# Runs on every push that changes api/, src/ (the TV app) or this file, or by hand (Actions -> Deploy backend -> Run workflow).
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   CONVERTER_SECRET, CONVERTER_GITHUB_TOKEN
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["api/**", "src/**", "tools/build-tv.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Check the secrets are saved
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CONVERTER_SECRET: ${{ secrets.CONVERTER_SECRET }}
          CONVERTER_GITHUB_TOKEN: ${{ secrets.CONVERTER_GITHUB_TOKEN }}
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CONVERTER_SECRET CONVERTER_GITHUB_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error::Repository secret $n is missing or empty"; missing=1; fi
          done
          exit $missing

      - run: npm ci

      - name: Build the TV app (works on older TV browsers too)
        run: node ../tools/build-tv.mjs ../src/littleroots-tv.html public/index.html ./node_modules

      - name: Create tables and load the videos (only new changes are applied)
        run: npx wrangler d1 migrations apply littleroots --remote

      - name: Publish
        id: deploy
        run: |
          if ! npx wrangler deploy > deploy.log 2>&1; then
            cat deploy.log
            msg=$(grep -vE '^\s*$|wrangler@4|npx wrangler|Update available|─' deploy.log | tail -n 8 | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-900)
            echo "::error title=Publish failed::$msg"
            exit 1
          fi
          cat deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Backend address::$url"

      - name: Pass the keys to the backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CONVERTER_SECRET: ${{ secrets.CONVERTER_SECRET }}
          GITHUB_TOKEN: ${{ secrets.CONVERTER_GITHUB_TOKEN }}
        run: |
          failed=0
          for n in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CONVERTER_SECRET GITHUB_TOKEN; do
            if printf '%s' "${!n}" | npx wrangler secret put "$n" > "$RUNNER_TEMP/out.txt" 2>&1; then
              echo "Saved $n"
            else
              failed=1
              # report wrangler's own message (it never prints the secret value)
              msg=$(grep -vE '^\s*$|wrangler@4|npx wrangler' "$RUNNER_TEMP/out.txt" | tail -n 6 | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-600)
              echo "::error title=Couldn't save $n::$msg"
            fi
          done
          rm -f "$RUNNER_TEMP/out.txt"
          exit $failed

      - name: Check it's live
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::Published, but the web address wasn't found in the output. See the Publish step."; exit 0; fi
          for i in $(seq 1 12); do curl -fsS "$URL/api/health" && break; sleep 5; done
          videos=$(curl -fsS "$URL/api/catalog" | jq '.videos | length')
          echo "Videos in the catalog: $videos"
          curl -fsS "$URL/" | grep -q "LittleRoots" || { echo "::error::The TV app page didn't load"; exit 1; }
          echo "::notice title=Live::TV app $URL/ · Admin page $URL/admin/ · catalog has $videos videos"
          {
            echo "## LittleRoots backend is live"
            echo ""
            echo "- TV app: $URL/"
            echo "- Admin page: $URL/admin/"
            echo "- Catalog: $URL/api/catalog ($videos videos)"
          } >> "$GITHUB_STEP_SUMMARY"
