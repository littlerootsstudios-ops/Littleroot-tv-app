# Builds the LG TV app package (.ipk). Download it from the run's "Artifacts" section.
name: Build LG TV app
on:
  push:
    branches: [main]
    paths: ["src/**", "tv/**", "tools/package-lg.sh", "tools/build-tv.mjs", ".github/workflows/package-lg.yml"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/package-lg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: littleroots-lg-tv-app
          path: dist/*.ipk
