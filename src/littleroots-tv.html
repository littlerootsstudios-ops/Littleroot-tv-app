<title>LittleRoots TV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,wght@9..144,100,500;9..144,100,700;9..144,100,900&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a living-room TV app. Full-bleed storybook hero, Disney-style "worlds" tiles, then Netflix-style rows. Built for a 10-foot screen and a remote; also works by touch. */
:root {
  --forest: #0D322C;      /* brand green: the app's ground */
  --canopy: #13443B;      /* raised surfaces */
  --moss: #1E5A4D;        /* hover / quiet fills */
  --gold: #D09D46;        /* brand gold: focus, actions */
  --gold-soft: #E7C27F;
  --parchment: #F3EBD8;   /* text on green */
  --mist: #A9C2B8;        /* secondary text */
  --danger: #E08A6D;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --gutter: max(16px, 4vw);
  color-scheme: dark;
}
html { font-size: clamp(14px, 0.55vw + 9px, 24px); }
html, body { background: var(--forest); color: var(--parchment); }
body { font-family: var(--body); line-height: 1.45; overflow-x: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
h1, h2, h3 { font-family: var(--display); font-variation-settings: "SOFT" 100; margin: 0; text-wrap: balance; }
.wrap { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }

/* focus: one gold ring language for remote, keyboard and touch */
.fx { outline: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.fx:focus-visible, .fx.is-focus { box-shadow: 0 0 0 3px var(--forest), 0 0 0 6px var(--gold); }
.card.fx:focus-visible, .card.fx.is-focus, .world.fx:focus-visible, .world.fx.is-focus { transform: scale(1.06); z-index: 2; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 1.5rem; padding-block: .9rem; background: linear-gradient(rgba(13,50,44,.92), rgba(13,50,44,0)); }
.top { transition: background .3s; }
.top.solid { background: var(--forest); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--forest); }
.logo { width: 7.5rem; flex: none; display: block; }
.logo .st0 { fill: var(--parchment); } .logo .st1 { fill: var(--gold); }
.nav { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 6px; }
.nav::-webkit-scrollbar { display: none; }
.nav button { padding: .45rem .95rem; border-radius: 99px; font-weight: 800; font-size: .95rem; color: var(--mist); white-space: nowrap; }
.nav button[aria-current="true"] { color: var(--forest); background: var(--parchment); }
.nav .parents { margin-left: auto; color: var(--gold-soft); }

/* hero */
.hero { position: relative; display: grid; align-items: end; min-height: min(66vh, 38rem); margin-top: -8rem; overflow: hidden; }
.hero canvas, .hero .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .hero-img { object-position: 70% 30%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--forest) 0%, rgba(13,50,44,.82) 34%, rgba(13,50,44,0) 70%), linear-gradient(0deg, var(--forest) 0%, rgba(13,50,44,0) 40%); }
.hero-copy { position: relative; z-index: 1; display: grid; gap: .8rem; max-width: 34rem; padding-block: 7rem 2.2rem; }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); }
.hero h1 { font-size: clamp(2.1rem, 4.6vw, 4.2rem); line-height: 1; font-weight: 900; }
.hero p { margin: 0; color: var(--mist); max-width: 30rem; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .85rem; font-weight: 700; color: var(--mist); }
.meta .ref { color: var(--gold-soft); }
.actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .4rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1.4rem; border-radius: 99px; font-weight: 800; background: var(--moss); }
.btn.primary { background: var(--gold); color: var(--forest); }
.btn svg { width: 1.05em; height: 1.05em; fill: currentColor; }

/* worlds (the Disney-style brand tiles) */
.worlds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1rem; padding-block: .6rem 1.4rem; }
.world { position: relative; aspect-ratio: 16 / 10; border-radius: 1rem; overflow: hidden; background: var(--canopy); border: 1px solid rgba(243,235,216,.12); max-width: 100%; }
.world canvas, .world img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; object-fit: cover; }
.world img { opacity: 1; }
.world span { position: absolute; inset: auto 0 0 0; padding: 1.6rem .8rem .7rem; font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.1; background: linear-gradient(0deg, rgba(13,50,44,.92), rgba(13,50,44,0)); }

/* rows */
.row { display: grid; gap: .7rem; padding-block: .5rem 1.2rem; }
.row-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
.row h2 { font-size: 1.45rem; font-weight: 700; }
.row-head small { color: var(--mist); font-weight: 700; font-size: .85rem; }
.track { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x proximity; padding: 10px 6px 14px; margin: -10px -6px -14px; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.card { flex: none; width: clamp(150px, 16vw, 330px); display: grid; gap: .45rem; scroll-snap-align: start; border-radius: .8rem; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: .8rem; overflow: hidden; background: var(--canopy); max-width: 100%; }
.thumb canvas, .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge.new { background: var(--gold); color: var(--forest); }
.badge { position: absolute; top: .5rem; left: .5rem; padding: .15rem .5rem; border-radius: 99px; font-size: .7rem; font-weight: 800; background: rgba(13,50,44,.85); color: var(--gold-soft); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(13,50,44,.7); }
.bar i { display: block; height: 100%; background: var(--gold); }
.card.short { width: clamp(110px, 9.5vw, 190px); }
.card.short .thumb { aspect-ratio: 9 / 16; }
.card b { font-weight: 800; font-size: .98rem; line-height: 1.2; padding-inline: .15rem; }
.card em { font-style: normal; font-size: .8rem; color: var(--mist); padding-inline: .15rem; margin-top: -.3rem; }
.verse .thumb { display: grid; place-items: center; padding: 1rem; background: radial-gradient(circle at 30% 20%, var(--moss), var(--canopy)); }
.verse q { position: relative; font-family: var(--display); font-style: italic; font-size: 1.02rem; line-height: 1.25; text-align: center; quotes: "\201C" "\201D"; }

.foot { padding-block: 1.5rem 3rem; color: var(--mist); font-size: .85rem; display: grid; gap: .3rem; max-width: 60rem; }
.foot code { color: var(--gold-soft); }

/* overlays */
.layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(6,24,21,.78); backdrop-filter: blur(6px); }
.sheet { width: min(58rem, 100%); max-height: 100%; overflow: auto; border-radius: 1.2rem; background: var(--canopy); border: 1px solid rgba(243,235,216,.1); }
.sheet-art { position: relative; aspect-ratio: 21 / 8; max-width: 100%; }
.sheet-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.sheet-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--canopy), rgba(19,68,59,0) 70%); }
.sheet-body { display: grid; gap: 1rem; padding: 0 1.6rem 1.6rem; margin-top: -2.5rem; position: relative; }
.sheet h2 { font-size: clamp(1.7rem, 3vw, 2.6rem); font-weight: 900; line-height: 1.05; }
.sheet p { margin: 0; max-width: 40rem; }
.talk { display: grid; gap: .5rem; padding: 1rem 1.2rem; border-radius: .9rem; background: var(--forest); }
.talk h3 { font-size: 1.05rem; font-weight: 700; color: var(--gold-soft); }
.talk ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .3rem; }
.eps { display: grid; gap: .5rem; }
.ep { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: .6rem .8rem; border-radius: .7rem; background: var(--forest); }
.ep > span:first-child { font-family: var(--display); font-weight: 900; font-size: 1.4rem; color: var(--gold); width: 1.6rem; text-align: center; font-variant-numeric: tabular-nums; }
.ep b { display: block; } .ep small { color: var(--mist); }
.ep > span:last-child { color: var(--mist); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* player */
.player { position: fixed; inset: 0; z-index: 60; background: #000; color: var(--parchment); display: grid; }
.yt-frame { position: absolute; inset: 0; overflow: hidden; background: #000; }
.yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.p-shield { position: absolute; inset: 0; z-index: 1; }
.p-pause { position: absolute; inset: 0; z-index: 2; display: grid; align-content: center; gap: .5rem; padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)); background: rgba(0,0,0,.72); opacity: 0; pointer-events: none; transition: opacity .3s; }
.player.paused .p-pause { opacity: 1; }
.p-pause h3 { font-family: var(--display); font-size: clamp(1.8rem, 4vw, 3.6rem); font-weight: 900; max-width: 40rem; }
.p-pause p { margin: 0; max-width: 36rem; color: var(--mist); }
.p-top { position: absolute; z-index: 3; inset: 0 0 auto; display: flex; align-items: center; gap: 1rem; padding: max(1.2rem, env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 3rem max(var(--gutter), env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .4s; }
.p-top h2 { font-size: clamp(1.1rem, 2vw, 1.7rem); font-weight: 700; }
.p-top .round { width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: rgba(243,235,216,.14); flex: none; }
.player.idle .p-top { opacity: 0; }
.player .p-ui { z-index: 3; position: absolute; inset: auto 0 0 0; }
.p-cover { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--forest); transition: opacity .7s; overflow: hidden; }
.p-cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; filter: blur(6px); transform: scale(1.08); }
.p-cover.gone { opacity: 0; pointer-events: none; }
.p-cover-txt { position: relative; display: grid; justify-items: center; gap: .7rem; text-align: center; padding: 1rem; }
.p-cover-txt .sting { width: min(14rem, 50vw); font-size: min(1rem, 3.6vw); margin-bottom: .6rem; }
.p-cover-txt h3 { font-size: clamp(1.8rem, 4.5vw, 4rem); font-weight: 900; max-width: 40rem; }
/* animated logo: letters pop in, sprout grows, then a gentle wave while loading */
.logo-anim { display: block; overflow: visible; }
.logo-anim .st0 { fill: var(--parchment); } .logo-anim .st1 { fill: var(--gold); }
.logo-anim path { transform-box: fill-box; transform-origin: 50% 100%; animation: lr-pop .55s cubic-bezier(.3, 1.6, .5, 1) both, lr-wave 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms), calc(1.1s + var(--i) * 85ms); }
.logo-anim .st1 { transform-origin: 50% 80%; animation: lr-grow .9s cubic-bezier(.3, 1.5, .5, 1) both, lr-sway 2.4s ease-in-out infinite; animation-delay: .1s, 1.1s; }
@keyframes lr-pop { from { opacity: 0; transform: translateY(35%) scale(.5); } to { opacity: 1; transform: none; } }
@keyframes lr-wave { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(-9%); } }
@keyframes lr-grow { 0% { opacity: 0; transform: scale(.2, 0); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes lr-sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg) scale(1.04); } }
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--forest); transition: opacity .6s ease, visibility .6s; }
.splash .sting { width: min(18rem, 62vw); font-size: min(1.3rem, 4.4vw); }
.splash { align-content: center; justify-items: center; gap: 1.6rem; text-align: center; }
.splash .tagline { margin: 0; padding-inline: 1.5rem; font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 500; font-style: italic; font-size: clamp(1.05rem, 2.2vw, 1.9rem); line-height: 1.3; color: var(--parchment); text-wrap: balance; }
.splash .tagline span { display: inline-block; opacity: 0; animation: tag-in .7s cubic-bezier(.2, .8, .3, 1) both; }
.splash .tagline span:nth-child(1) { animation-delay: 3.5s; }
.splash .tagline span:nth-child(2) { animation-delay: 3.9s; }
.splash .tagline span:nth-child(3) { animation-delay: 4.3s; color: var(--gold-soft); }
@keyframes tag-in { from { opacity: 0; transform: translateY(.6em); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .splash .tagline span { animation: lr-fade .6s both; } }

/* ---- Logo sting: seed drops, bursts, sprout grows, letters spring in, happy hop ---- */
.sting { position: relative; display: block; }
.sting .logo-anim { position: relative; z-index: 1; animation: lr-hop .8s ease-out 3.08s both, lr-glow 1.6s ease-in-out 3.15s both; }
.sting .logo-anim path { opacity: 0; animation-name: lr-spring, lr-wave; animation-duration: .8s, 2.4s; animation-timing-function: cubic-bezier(.25, 1.3, .4, 1), ease-in-out; animation-iteration-count: 1, infinite; animation-fill-mode: both, none; animation-delay: calc(1.35s + var(--i) * 135ms), calc(4.65s + var(--i) * 85ms); }
.sting .logo-anim .rt { animation-name: lr-drop, lr-wave; animation-duration: .85s, 2.4s; }
.sting .logo-anim .st1 { transform-origin: 50% 80%; animation: lr-sprout 1.05s cubic-bezier(.3, 1.4, .5, 1) .83s both, lr-sway 2.4s ease-in-out 4.65s infinite; }
@keyframes lr-spring { 0% { opacity: 0; transform: translateY(70%) scale(.4, .2); } 35% { opacity: 1; transform: translateY(-24%) scale(.85, 1.25); } 60% { transform: translateY(6%) scale(1.15, .85); } 80% { transform: translateY(-4%) scale(.97, 1.04); } 100% { opacity: 1; transform: none; } }
@keyframes lr-drop { 0% { opacity: 0; transform: translateY(-170%) scale(.9, 1.2); } 45% { opacity: 1; transform: translateY(0) scale(1.25, .7); } 65% { transform: translateY(-20%) scale(.92, 1.1); } 82% { transform: translateY(0) scale(1.06, .94); } 100% { opacity: 1; transform: none; } }
@keyframes lr-sprout { 0% { opacity: 0; transform: scale(.1, 0) rotate(-20deg); } 30% { opacity: 1; transform: scale(.5, .7) rotate(-6deg); } 55% { transform: scale(1.1, 1.2) rotate(9deg); } 78% { transform: scale(.95) rotate(-4deg); } 100% { opacity: 1; transform: none; } }
@keyframes lr-hop { 0%, 100% { transform: none; } 40% { transform: translateY(-6%) scale(1.06); } 70% { transform: translateY(1%) scale(.99); } }
@keyframes lr-glow { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 .7em rgba(231, 194, 127, .8)); } }
.sting .seed { position: absolute; z-index: 2; left: 35.5%; top: 47%; width: .9em; height: .9em; margin: -.45em 0 0 -.45em; border-radius: 50% 50% 46% 46%; background: radial-gradient(circle at 35% 30%, #F6D9A0, var(--gold) 60%); animation: seed-fall .75s cubic-bezier(.45, 0, 1, .5) both, seed-land .35s ease-out .75s both; }
@keyframes seed-fall { 0% { transform: translateY(-16em) rotate(-200deg); } 100% { transform: none; } }
@keyframes seed-land { 0% { transform: scale(1.6, .55); } 55% { opacity: 1; transform: scale(.85, 1.15); } 100% { opacity: 0; transform: scale(0); } }
.sting .burst { position: absolute; z-index: 2; left: 35.5%; top: 47%; }
.sting .burst i { position: absolute; left: 0; top: 0; width: .42em; height: .42em; margin: -.21em; border-radius: 50%; background: var(--gold-soft); opacity: 0; animation: lr-spark 1s cubic-bezier(.15, .85, .3, 1) .83s both; }
.sting .burst i:nth-child(3n) { background: var(--parchment); width: .3em; height: .3em; }
.sting .burst i:nth-child(2n) { animation-delay: .89s; }
@keyframes lr-spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1.2); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(.2); } }
.sting .tw { position: absolute; z-index: 2; width: .55em; height: .55em; background: var(--gold-soft); transform: rotate(45deg) scale(0); border-radius: 2px; box-shadow: 0 0 .5em rgba(231, 194, 127, .9); animation: lr-twinkle 1.8s ease-in-out infinite; }
@keyframes lr-twinkle { 0%, 100% { transform: rotate(45deg) scale(0); opacity: 0; } 50% { transform: rotate(45deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sting .seed, .sting .burst, .sting .tw { display: none; } .sting .logo-anim, .sting .logo-anim path, .sting .logo-anim .st1 { animation: lr-fade .5s both; } }
.splash.done { opacity: 0; visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .logo-anim path, .logo-anim .st1 { animation: lr-fade .4s both; } @keyframes lr-fade { from { opacity: 0; } } }
.p-spin { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 4px solid rgba(243,235,216,.2); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.p-buffer { position: absolute; z-index: 2; left: 50%; top: 50%; width: 7rem; transform: translate(-50%, -50%); display: none; padding: 1rem 1.2rem; border-radius: 1rem; background: rgba(13,50,44,.75); }
.player.buffering .p-buffer { display: block; }
.p-end { position: absolute; inset: 0; z-index: 6; display: grid; align-content: center; gap: 1.2rem; padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)); background: linear-gradient(90deg, var(--forest) 30%, rgba(13,50,44,.7)), var(--forest); }
.p-end .next { display: grid; grid-template-columns: minmax(0, 22rem) minmax(0, 1fr); gap: 1.5rem; align-items: center; max-width: 60rem; }
.p-end .next img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: .9rem; }
.p-end .next h3 { font-family: var(--display); font-size: clamp(1.6rem, 3.4vw, 3rem); font-weight: 900; }
.count { color: var(--gold-soft); font-weight: 800; }
.p-track { cursor: pointer; }
.p-row .btn svg { width: 1.2em; height: 1.2em; }
@media (max-width: 760px) { .p-end .next { grid-template-columns: 1fr; } .p-row .btn { padding: .6rem .9rem; } }
@media (prefers-reduced-motion: reduce) { .p-spin { animation-duration: 3s; } }
.p-close { position: absolute; z-index: 2; top: max(1.2rem, env(safe-area-inset-top, 0px)); left: max(var(--gutter), env(safe-area-inset-left, 0px)); transition: opacity .4s; }
.player.idle .p-close { opacity: 0; }
.player canvas, .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.player canvas.kb { animation: kb 30s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.12) translate(-2%, 1%); } }
.p-ui { position: relative; z-index: 1; align-self: end; display: grid; gap: .8rem; padding: 2rem max(var(--gutter), env(safe-area-inset-right, 0px)) max(2rem, env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px)); background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .4s; }
.player.idle .p-ui { opacity: 0; }
.p-ui h2 { font-size: clamp(1.4rem, 2.6vw, 2.4rem); font-weight: 700; }
.p-track { height: 6px; border-radius: 3px; background: rgba(243,235,216,.25); overflow: hidden; }
.p-track i { display: block; height: 100%; background: var(--gold); width: 0; }
.p-row { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.p-row .time { margin-left: auto; color: var(--mist); font-weight: 700; }
.p-note { font-size: .8rem; color: var(--mist); }
.p-title { position: absolute; z-index: 1; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; display: grid; gap: .4rem; text-shadow: 0 2px 20px rgba(0,0,0,.5); width: min(90%, 40rem); }
.p-title h3 { font-size: clamp(1.8rem, 4.5vw, 4rem); font-weight: 900; }

/* gate + parents */
.gate { width: min(30rem, 100%); padding: 1.8rem; border-radius: 1.2rem; background: var(--canopy); display: grid; gap: 1rem; text-align: center; }
.gate h2 { font-size: 1.6rem; }
.gate .q { font-family: var(--display); font-size: 2.4rem; font-weight: 900; color: var(--gold-soft); }
.choices { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; }
.choices .btn { min-width: 4.5rem; justify-content: center; font-size: 1.2rem; }
.msg { min-height: 1.4em; color: var(--danger); font-weight: 700; }
.set { display: grid; gap: .5rem; text-align: left; }
.set h3 { font-size: 1.05rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chips .btn[aria-pressed="true"] { background: var(--gold); color: var(--forest); }

  .hero::after { background: linear-gradient(0deg, var(--forest) 18%, rgba(13,50,44,.55) 60%, rgba(13,50,44,.2)); }
  .nav .parents { margin-left: 0; }
  .ep { grid-template-columns: auto 1fr; } .ep > span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { .fx, .p-ui { transition: none; } .player canvas.kb { animation: none; } }

const LOGO_ORDER = { 2: 0, 1: 1, 9: 2, 8: 3, 3: 4, 10: 5, 0: 6, 5: 7, 6: 8, 4: 9, 7: 10 }; // path index -> reading order
function animLogo(intro) {
  const svg = document.querySelector(".top .logo").cloneNode(true);
  svg.setAttribute("class", "logo-anim"); svg.setAttribute("aria-hidden", "true"); svg.removeAttribute("role");
  [...svg.querySelectorAll("path")].forEach((p, i) => {
    const order = i in LOGO_ORDER ? LOGO_ORDER[i] : i;
    p.style.setProperty("--i", order);
    if (order >= 6) p.classList.add("rt"); // "Roots" letters drop in from above
  });
  if (!intro) return svg.outerHTML;
  const sparks = Array.from({ length: 12 }, (_, k) => `<i style="--a:${k * 30 + (k % 2) * 12}deg;--r:${3.2 + (k % 3) * 1.6}em"></i>`).join("");
  const stars = [[8, 12, 3.4], [88, 6, 3.75], [96, 58, 4.1], [4, 70, 4.5]].map(([x, y, d]) => `<span class="tw" style="left:${x}%;top:${y}%;animation-delay:${d}s"></span>`).join("");
  return `<div class="sting" aria-hidden="true"><span class="seed"></span><span class="burst">${sparks}</span>${svg.outerHTML}${stars}</div>`;
}

/* ---- Sonic logo: synthesised live (no audio files). Kalimba-style plucks in D major pentatonic. ---- */
let audio = null;
function audioCtx() {
  if (audio) return audio;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  try { audio = new AC(); } catch (e) { return null; }
  return audio;
}
function unlockAudio() { const ac = audioCtx(); if (ac && ac.state === "suspended") ac.resume(); }
["keydown", "pointerdown", "touchstart"].forEach(ev => addEventListener(ev, unlockAudio, { passive: true }));
function playSting(offset) {
  offset = offset || 0;
  if (settings.sound === false) return;
  const ac = audioCtx(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const t0 = ac.currentTime + 0.06 - offset;
  const late = t => t < ac.currentTime + 0.02; // skip moments that have already passed
  const out = ac.createDynamicsCompressor(); out.connect(ac.destination);
  const master = ac.createGain(); master.gain.value = 0.55; master.connect(out);
  // small room reverb from decaying noise
  const verb = ac.createConvolver(), len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let n = 0; n < len; n++) d[n] = (Math.random() * 2 - 1) * Math.pow(1 - n / len, 3); }
  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = 0.28; verb.connect(wet); wet.connect(master);
  const send = node => { node.connect(master); node.connect(verb); };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function pluck(midi, t, vel, len = 1.3) {
    if (late(t)) return;
    const f = hz(midi), g = ac.createGain(); send(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [[1, "sine", 1], [2, "sine", .28], [5.4, "triangle", .06]].forEach(([mul, type, amp]) => {
      const o = ac.createOscillator(), og = ac.createGain(); o.type = type; o.frequency.value = f * mul;
      og.gain.setValueAtTime(amp, t); if (mul > 2) og.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + len + 0.05);
    });
  }
  function glide(f1, f2, t, dur, vel, type = "sine") {
    if (late(t)) return;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; send(g); o.connect(g);
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // 1. seed falls (whistle) and lands (soft plunk)
  glide(1500, 380, t0, 0.74, 0.05);
  glide(190, 58, t0 + 0.75, 0.3, 0.5);
  // 2. sparkle burst
  [93, 98, 100, 102, 105, 107, 110].forEach((m, k) => pluck(m, t0 + 0.83 + k * 0.04 + Math.random() * 0.02, 0.07, 0.55));
  // 3. sprout grows: rising bloop with a wobble at the top
  glide(220, 880, t0 + 0.86, 0.68, 0.12, "triangle");
  glide(880, 740, t0 + 1.54, 0.26, 0.06, "triangle");
  // 4. "Little" climbs as each letter springs up; "Roots" bounces down as each letter lands
  [74, 76, 78, 81, 83].forEach((m, k) => pluck(m, t0 + 1.4 + [0, 2, 3, 4, 5][k] * 0.135, 0.3));
  [86, 83, 81, 78, 76].forEach((m, k) => pluck(m, t0 + 2.54 + k * 0.135, 0.26));
  // 5. signature: warm chord + bell on the hop, then soft chimes as the stars twinkle
  [62, 66, 69, 74].forEach((m, k) => pluck(m, t0 + 3.12 + k * 0.025, 0.2, 2.6));
  [50, 57].forEach(m => { const ts = t0 + 3.08; if (late(ts)) return; const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = "sawtooth"; o.frequency.value = hz(m); lp.type = "lowpass"; lp.frequency.value = 900; o.connect(lp); lp.connect(g); send(g); g.gain.setValueAtTime(0.0001, ts); g.gain.exponentialRampToValueAtTime(0.06, ts + 0.26); g.gain.exponentialRampToValueAtTime(0.0001, ts + 1.9); o.start(ts); o.stop(ts + 2); });
  pluck(98, t0 + 3.18, 0.16, 2.2);
  pluck(105, t0 + 3.45, 0.07, 1.8);
  [102, 107, 105, 110].forEach((m, k) => pluck(m, t0 + 3.68 + k * 0.3, 0.045, 1.1));
}

    <div class="yt-frame"><div id="ytp"></div></div>
    <div class="p-shield"></div>
    <div class="p-buffer">${animLogo()}</div>
    <div class="p-pause"><span class="eyebrow">You're watching</span><h3>${esc(v.title)}</h3><p>${esc(v.desc)}</p></div>
    <div class="p-top"><button class="round fx" data-fg="p-top" data-act="close" aria-label="Back to LittleRoots">${ICON.arrow}</button>
      <div><span class="eyebrow">${esc(info(v).join(" · "))}</span><h2>${esc(v.title)}</h2></div></div>
    <div class="p-ui">
      <div class="p-track"><i></i></div>
      <div class="p-row">
        <button class="btn primary fx" data-fg="p" data-act="toggle" aria-label="Pause">${ICON.pause}</button>
        <button class="btn fx" data-fg="p" data-act="back10" aria-label="Back 10 seconds">${ICON.back10}10</button>
        <button class="btn fx" data-fg="p" data-act="fwd10" aria-label="Forward 10 seconds">${ICON.fwd10}10</button>
        <button class="btn fx" data-fg="p" data-act="next">${ICON.next}Next</button>
        <span class="time">${fmt(start)} / ${tot ? fmt(tot) : "–:––"}</span>
      </div>
    </div>
    <div class="p-cover"><img src="${ytThumb(v.yt, true)}" alt="" onerror="this.onerror=null;this.src='${ytThumb(v.yt)}'">
      <div class="p-cover-txt">${animLogo(true)}<span class="eyebrow">LittleRoots presents</span><h3>${esc(v.title)}</h3><span class="hint p-msg"></span></div></div>`;
  el.hidden = false;
  const me = P = { slug: v.slug, yt: true, t: start, start, total: tot, paused: false, started: false, ytp: null, idle: null, end: null, stingEnd: Date.now() + 4900 };
  playSting();
  P.tick = setInterval(() => {
    if (!P || !P.ytp || !P.ytp.getCurrentTime) return;
    P.t = P.ytp.getCurrentTime() || P.t; P.total = P.ytp.getDuration() || P.total;
    updateYT();
  }, 250);
  P.watch = setInterval(() => { if (P && !P.paused && P.started) { watchedToday++; if (settings.limit && watchedToday >= settings.limit * 60) { endPlayback(false); showBreak(); } } }, 1000);
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = e => { e.stopPropagation(); playerAction(b.dataset.act); });
  el.querySelector(".p-shield").onclick = () => { if (el.classList.contains("idle")) wake(); else playerAction("toggle"); };
  el.querySelector(".p-track").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); if (P && P.total && P.ytp) { P.ytp.seekTo((e.clientX - r.left) / r.width * P.total, true); wake(); } };
  el.onpointermove = wake;
  focusFirst(el); setFocus(el.querySelector('[data-act="toggle"]'));
  loadYT().then(ok => {
    if (P !== me) return;
    if (!ok || !window.YT) return coverMsg("This story couldn't load. Check the internet connection and try again.");
    P.ytp = new YT.Player("ytp", {
      videoId: v.yt, host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, cc_load_policy: 0, start: Math.floor(start), origin: location.origin },
      events: {
        onReady: e => { if (P !== me) return; e.target.mute(); e.target.playVideo(); setTimeout(() => { if (P === me && !P.started) coverMsg("Press OK to play"); }, 3500); },
        onStateChange: e => P === me && ytState(e.data),
        onError: () => P === me && coverMsg("This story isn't available right now. Try another one."),

  });
}
function coverMsg(t) { const c = document.querySelector(".p-cover"); if (!c) return; c.classList.remove("gone"); c.querySelector(".p-msg").textContent = t; const sp = c.querySelector(".p-cover-txt .p-spin"); if (sp) sp.hidden = /OK/.test(t) ? true : sp.hidden; }
function ytState(s) {
  const el = $("#player");
  el.classList.toggle("buffering", s === 3);
  if (s === 1) {
    P.paused = false; el.classList.remove("paused");
    if (!P.started) {
      P.started = true; const me = P;
      // keep the intro card up until the sting has finished (and YouTube's title has faded), then start from the top with sound
      setTimeout(() => {
        if (P !== me) return;
        try { if (Math.abs(P.ytp.getCurrentTime() - P.start) > 0.5) P.ytp.seekTo(P.start, true); P.ytp.unMute(); } catch (e) {}
        const c = el.querySelector(".p-cover"); if (c) c.classList.add("gone");
      }, Math.max(2200, P.stingEnd - Date.now()));
    }

  }
  if (s === 2) { P.paused = true; el.classList.add("paused"); wake(); }
  if (s === 0) showEnd();
  updateYT();
}
function updateYT() {
  const el = $("#player"); if (!P || !P.yt || el.hidden) return;
  el.querySelector(".p-track i").style.width = (P.total ? P.t / P.total * 100 : 0) + "%";
  el.querySelector(".time").textContent = `${fmt(P.t)} / ${P.total ? fmt(P.total) : "–:––"}`;
  const tg = el.querySelector('[data-act="toggle"]'); tg.innerHTML = P.paused ? ICON.play : ICON.pause; tg.setAttribute("aria-label", P.paused ? "Play" : "Pause");
}
function showEnd() {
  const el = $("#player"), v = bySlug(P.slug), n = nextOf(v);
  P.finished = true; let left = 8;
  const end = document.createElement("div"); end.className = "p-end";
  end.innerHTML = `<span class="eyebrow">Well done! Story finished</span>
    <div class="next"><img src="${ytThumb(n.yt)}" alt="">
      <div style="display:grid;gap:.6rem"><span class="hint">Up next</span><h3>${esc(n.title)}</h3><span class="count">Starting in <b>${left}</b> s</span>
      <div class="actions"><button class="btn primary fx" data-fg="end" data-e="next">${ICON.play}Play now</button><button class="btn fx" data-fg="end" data-e="again">Watch again</button><button class="btn fx" data-fg="end" data-e="close">Back to LittleRoots</button></div></div></div>
    <div class="talk" style="max-width:40rem"><h3>Talk about it together</h3><ol>${v.talk.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>`;
  el.appendChild(end);
  const go = what => { clearInterval(P && P.end); if (what === "close") return endPlayback(true); const slug = what === "again" ? v.slug : n.slug; endPlayback(true, true); if (what === "again") progress[slug] = 0; play(slug); };
  end.querySelectorAll("[data-e]").forEach(b => b.onclick = () => go(b.dataset.e));
  P.end = setInterval(() => { left--; const c = end.querySelector(".count b"); if (c) c.textContent = left; if (left <= 0) go("next"); }, 1000);
  end.onpointermove = () => { clearInterval(P && P.end); const c = end.querySelector(".count"); if (c) c.textContent = "Paused"; };
  focusFirst(end); setFocus(end.querySelector('[data-e="next"]'));
}
function playerAction(a) {
  if (!P) return;
  if (a === "close") return endPlayback(false);
  if (P.yt) {
    if (!P.ytp || !P.ytp.getPlayerState) return;
    if (a === "toggle") P.paused ? P.ytp.playVideo() : P.ytp.pauseVideo();
    if (a === "back10" || a === "fwd10") { P.ytp.seekTo(Math.max(0, P.t + (a === "fwd10" ? 10 : -10)), true); }
    if (a === "next") { const n = nextOf(bySlug(P.slug)); endPlayback(false, true); return play(n.slug); }
    return wake();
  }
  if (a === "toggle") { P.paused = !P.paused; if (P.video) P.paused ? P.video.pause() : P.video.play(); }
  if (a === "back10" || a === "fwd10") { P.t = Math.max(0, Math.min(P.total - 1, P.t + (a === "fwd10" ? 10 : -10))); if (P.video) P.video.currentTime = P.t; }
  updatePlayer(); wake();
}
function updatePlayer() {
  const el = $("#player"); if (!P || P.yt || el.hidden) return;
  el.querySelector(".p-track i").style.width = (P.t / P.total * 100) + "%";
  el.querySelector(".time").textContent = `${fmt(P.t)} / ${fmt(P.total)}`;
  el.querySelector('[data-act="toggle"]').textContent = P.paused ? "Play" : "Pause";
  if (settings.limit && watchedToday >= settings.limit * 60) { endPlayback(false); showBreak(); }
}
function wake() { const el = $("#player"); el.classList.remove("idle"); if (!P) return; clearTimeout(P.idle); P.idle = setTimeout(() => P && !P.paused && el.classList.add("idle"), 3500); }
function endPlayback(finished, chaining) {
  if (!P) return;
  clearInterval(P.tick); clearInterval(P.watch); clearInterval(P.end); clearTimeout(P.idle); if (P.hls) P.hls.destroy(); if (P.video) P.video.pause();
  if (P.ytp && P.ytp.destroy) { try { P.ytp.destroy(); } catch {} }
  if (P.yt && P.total) { durs[P.slug] = Math.round(P.total); store.set("dur", durs); }
  delete progress[P.slug]; if (!(finished || P.finished) && P.t > 5) progress[P.slug] = P.t; // re-insert so the latest is last
  if (chaining) { store.set("progress", progress); P = null; return; }
  store.set("progress", progress); store.set("watched-" + new Date().toDateString(), watchedToday);
  const slug = P.slug; P = null;
  $("#player").hidden = true; $("#player").innerHTML = "";
  renderRows(); refocus(slug);
  if (finished && !P) toast("Well done! Story finished.");
}

/* ---------- grown-ups: gate, settings, screen-time break ---------- */
function openGate() {
  const a = 3 + Math.floor(Math.random() * 5), b = 3 + Math.floor(Math.random() * 6), ans = a * b;
  const opts = [ans, ans + a, ans - b].sort(() => Math.random() - .5);
  const g = $("#gate");
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Grown-ups only">
    <span class="eyebrow">Grown-ups only</span><h2>Ask a grown-up to answer</h2>
    <div class="q">${a} × ${b} = ?</div>
    <div class="choices">${opts.map(o => `<button class="btn fx" data-fg="g" data-v="${o}">${o}</button>`).join("")}</div>
    <div class="msg" aria-live="polite"></div>
    <div class="choices"><button class="btn fx" data-fg="g2" data-v="close">Back</button></div></div>`;
  g.hidden = false;
  g.querySelectorAll("[data-v]").forEach(btn => btn.onclick = () => {
    if (btn.dataset.v === "close") return closeLayer();
    if (+btn.dataset.v === ans) openParents(); else g.querySelector(".msg").textContent = "Not quite. Ask a grown-up for help.";
  });
  focusFirst(g);
}
function openParents() {
  const g = $("#gate");
  const mins = Math.floor(watchedToday / 60);
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Grown-ups">
    <span class="eyebrow">Grown-ups</span><h2>Family settings</h2>
    <div class="set"><h3>Daily screen time</h3>
      <div class="chips">${[0, 20, 45, 90].map(m => `<button class="btn fx" data-fg="limit" data-limit="${m}" aria-pressed="${settings.limit === m}">${m ? m + " min" : "No limit"}</button>`).join("")}</div>
      <span class="hint">Watched today: ${mins} min. When the limit is reached, Zara invites your child to take a break.</span></div>
    <div class="set"><h3>Sound effects</h3>
      <div class="chips">${[true, false].map(on => `<button class="btn fx" data-fg="sound" data-sound="${on}" aria-pressed="${(settings.sound !== false) === on}">${on ? "On" : "Off"}</button>`).join("")}</div>
      <span class="hint">The LittleRoots sound that plays with the logo before each story.</span></div>
    <div class="set"><h3>Privacy</h3><span class="hint">LittleRoots shows no ads and collects no personal data from children. Watch progress stays on this TV.</span></div>
    <div class="choices"><button class="btn primary fx" data-fg="g3" data-v="done">Done</button></div></div>`;
  g.querySelectorAll("[data-limit]").forEach(b => b.onclick = () => {
    settings.limit = +b.dataset.limit; store.set("settings", settings);
    g.querySelectorAll("[data-limit]").forEach(x => x.setAttribute("aria-pressed", x === b));
    toast(settings.limit ? `Daily limit set to ${settings.limit} minutes` : "Daily limit turned off");
  });
  g.querySelectorAll("[data-sound]").forEach(b => b.onclick = () => {
    settings.sound = b.dataset.sound === "true"; store.set("settings", settings);
    g.querySelectorAll("[data-sound]").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (settings.sound) playSting();
    toast(settings.sound ? "Sound effects on" : "Sound effects off");
  });
  g.querySelector('[data-v="done"]').onclick = closeLayer;
  focusFirst(g);
}
function showBreak() {
  const g = $("#gate");
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Time for a break">
    <span class="eyebrow">That's all for today</span><h2>Time to rest your eyes</h2>
    <p>Zara says: go tell someone the story you just watched, then come back tomorrow for more.</p>
    <div class="choices"><button class="btn primary fx" data-fg="g" data-v="ok">OK</button><button class="btn fx" data-fg="g" data-v="adult">Grown-ups</button></div></div>`;
  g.hidden = false;
  g.querySelector('[data-v="ok"]').onclick = closeLayer;
  g.querySelector('[data-v="adult"]').onclick = openGate;

/* ---------- remote-control navigation (spatial focus) ---------- */
let lastBrowseFocus = null;
function topLayer() {
  if (!$("#player").hidden) return $("#player");
  if (!$("#gate").hidden) return $("#gate");
  if (!$("#detail").hidden) return $("#detail");
  return document.body;
}
function groups(layer) {
  const order = [], map = {};
  const endScreen = layer.querySelector && layer.querySelector(".p-end"); if (endScreen) layer = endScreen;
  layer.querySelectorAll("[data-fg]").forEach(el => {
    if (el.closest("[hidden]") || (layer === document.body && el.closest(".layer, .player"))) return;
    const k = el.dataset.fg; if (!map[k]) { map[k] = []; order.push(k); } map[k].push(el);
  });
  return order.map(k => map[k]);
}
function setFocus(el) {
  if (!el) return;
  document.querySelectorAll(".is-focus").forEach(e => e.classList.remove("is-focus"));
  el.classList.add("is-focus"); el.focus({ preventScroll: true });
  el.scrollIntoView({ block: el.closest(".hero") ? "end" : "nearest", inline: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (el.closest(".nav") && el.dataset.target === "hero") window.scrollTo({ top: 0, behavior: "smooth" });
}
function focusFirst(layer) { const g = groups(layer); setFocus(g[0] && g[0][0]); }
function refocus(slug) {
  const el = (slug && document.querySelector(`#rows [data-slug="${slug}"]`)) || lastBrowseFocus;
  if (el && document.contains(el)) setFocus(el); else setFocus($("#heroPlay"));
}
function move(dir) {
  const layer = topLayer(), gs = groups(layer);
  const cur = document.activeElement;
  let gi = gs.findIndex(g => g.includes(cur));
  if (gi < 0) return focusFirst(layer);
  let i = gs[gi].indexOf(cur);
  if (dir === "left" || dir === "right") { i += dir === "right" ? 1 : -1; if (i >= 0 && i < gs[gi].length) setFocus(gs[gi][i]); return; }
  gi += dir === "down" ? 1 : -1; if (gi < 0 || gi >= gs.length) return;
  const cx = cur.getBoundingClientRect().left + cur.getBoundingClientRect().width / 2;
  const best = gs[gi].reduce((b, el) => { const r = el.getBoundingClientRect(); const d = Math.abs(r.left + r.width / 2 - cx); return d < b.d ? { el, d } : b; }, { el: gs[gi][0], d: Infinity });
  setFocus(best.el);
}
function closeLayer() {
  if (!$("#gate").hidden) { $("#gate").hidden = true; $("#gate").innerHTML = ""; return refocus(); }
  if (!$("#detail").hidden) { $("#detail").hidden = true; $("#detail").innerHTML = ""; return refocus(); }
}
const BACK = [8, 27, 461, 10009]; // Backspace (VIDAA), Escape, LG webOS Back, Tizen Back
document.addEventListener("keydown", e => {
  const k = { 37: "left", 38: "up", 39: "right", 40: "down" }[e.keyCode];
  if (!$("#player").hidden) {
    if (!document.querySelector(".p-end")) wake();
    if (BACK.includes(e.keyCode)) { e.preventDefault(); return endPlayback(!!(P && P.finished)); }
    if (P && (e.keyCode === 415 || e.keyCode === 19 || e.keyCode === 32)) { e.preventDefault(); return playerAction("toggle"); } // remote Play/Pause keys
  }
  if (k) { e.preventDefault(); return move(k); }
  if (BACK.includes(e.keyCode)) {
    e.preventDefault();
    if (topLayer() !== document.body) return closeLayer();
    return setFocus($("#nav button"));
  }
});
document.addEventListener("focusin", e => { if (topLayer() === document.body && e.target.closest("#browse, .top")) lastBrowseFocus = e.target; });
document.addEventListener("click", e => {
  const card = e.target.closest("#rows .card"); if (card) return openDetail(card.dataset.slug);
  const t = e.target.closest("[data-target]"); if (!t) return;
  if (t.dataset.target === "parents") return openGate();
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.target === t.dataset.target));
  if (t.dataset.target === "hero") { window.scrollTo({ top: 0, behavior: "smooth" }); return setFocus($("#heroPlay")); }
  const first = document.querySelector(`#row-${t.dataset.target} .card`); if (first) setFocus(first);
});

addEventListener("scroll", () => { const t = document.querySelector(".top"); if (t) t.classList.toggle("solid", scrollY > 60); }, { passive: true });
/* ---------- start ---------- */
$("#splash").innerHTML = animLogo(true) + `<p class="tagline"><span>Small seeds.</span> <span>Deep roots.</span> <span>Stories for every generation.</span></p>`;
const splashStart = Date.now(); let splashSound = false;
try { const ac = audioCtx(); if (ac && ac.state === "running") { playSting(); splashSound = true; } } catch (e) {}
["keydown", "pointerdown", "touchstart"].forEach(ev => addEventListener(ev, function joinSplash() {
  removeEventListener(ev, joinSplash);
  const el = document.querySelector("#splash"), t = (Date.now() - splashStart) / 1000;
  if (splashSound || !el || t > 4.7) return; splashSound = true; unlockAudio(); playSting(t);
}, { passive: true }));
renderStatic(); renderRows();
setTimeout(() => { $("#splash").classList.add("done"); setTimeout(() => $("#splash").remove(), 700); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 6200);
setFocus($("#heroPlay"));
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { paintAll(document); paint($("#heroArt"), bySlug(HERO).scene, "hero", innerWidth > 760 ? .66 : .5); }, 200); });
</script>
